kind: Pod
metadata:
  name: rogue-client
  namespace: invoiceflow
  labels:
    role: unknown
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
