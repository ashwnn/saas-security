apiVersion: v1
kind: Namespace
metadata:
  name: invoiceflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceflow-api
  namespace: invoiceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoiceflow-api
  template:
    metadata:
      labels:
        app: invoiceflow-api
    spec:
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Service
metadata:
  name: invoiceflow-api
  namespace: invoiceflow
spec:
  type: NodePort
  selector:
    app: invoiceflow-api
  ports:
    - name: http
      port: 8080
      targetPort: http

